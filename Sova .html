/* ---------- utils ---------- */
function rnd(i,j){let h=Math.imul(i,73856093)^Math.imul(j,19349663);h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296;}
function vn(X,Y){const i=Math.floor(X),j=Math.floor(Y),fx=X-i,fy=Y-j;const s=t=>t*t*(3-2*t);const a=rnd(i,j),b=rnd(i+1,j),c=rnd(i,j+1),d=rnd(i+1,j+1);return a+(b-a)*s(fx)+(c-a)*s(fy)+(a-b-c+d)*s(fx)*s(fy);}
const RGB={};function rgb(h){if(RGB[h])return RGB[h];const v=[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];RGB[h]=v;return v;}
function mk(w,h){const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.imageSmoothingEnabled=false;return [c,x];}
function painter(w,h){const [c,x]=mk(w,h);const img=x.createImageData(w,h);const d=img.data;
return {c,w,h,p(i,j,hex,a){i=i|0;j=j|0;if(i<0||j<0||i>=w||j>=h||!hex)return;const v=rgb(hex);const k=(j*w+i)*4;if(a===undefined||a>=1){d[k]=v[0];d[k+1]=v[1];d[k+2]=v[2];d[k+3]=255;}else{d[k]=d[k]*(1-a)+v[0]*a;d[k+1]=d[k+1]*(1-a)+v[1]*a;d[k+2]=d[k+2]*(1-a)+v[2]*a;d[k+3]=255;}},done(){x.putImageData(img,0,0);return c;}};}
function blank(W,H){return Array.from({length:H},()=>new Array(W).fill(null));}
function outline(g,col){const H=g.length,W=g[0].length,o=g.map(r=>r.slice());for(let j=0;j<H;j++)for(let i=0;i<W;i++){if(g[j][i])continue;if([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>g[j+dy]&&g[j+dy][i+dx]))o[j][i]=col||"k";}return o;}

function tW(s,sc){sc=sc||1;return s.length*6*sc-sc;}
function txt(x,s,li,lj,col,sc,sh){sc=sc||1;const pass=(c,dx)=>{x.fillStyle=c;[...s].forEach((ch,n)=>{(FONT[ch]||FONT[" "]).forEach((r,j)=>{for(let i=0;i<5;i++)if(r[i]==="#")x.fillRect(li+n*6*sc+i*sc+dx,lj+j*sc+dx,sc,sc);});});};if(sh)pass(sh,sc);pass(col,0);}
function txtR(x,s,ri,lj,col,sc,sh){txt(x,s,ri-tW(s,sc),lj,col,sc,sh);}
function txtC(x,s,lj,col,sc,sh){txt(x,s,Math.round((180-tW(s,sc))/2),lj,col,sc,sh);}

function makeHero(st){const g=blank(24,32);const set=(i,j,c)=>{if(j>=0&&j<32&&i>=0&&i<24)g[j][i]=c;};
const hy=1;const front=st.face.startsWith("front");
(front?HF:H34).forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch!==".")set(i+1,hy+j,ch);}));
const f=(i,j,c)=>set(i+1,hy+j,c);const at=(i,j)=>g[hy+j]&&g[hy+j][i+1];const m=st.face;
if(front){if(m==="frontJoy"){[[3,8],[4,7],[5,6],[6,6],[7,7],[8,8]].forEach(([i,j])=>{f(i,j,"K");f(i+9,j,"K");});for(let i=3;i<=7;i++){f(i,3,"E");f(i+9,3,"E");}f(9,11,"M");f(10,11,"M");}
else{[[5,3,7],[6,2,8],[7,2,8],[8,2,8],[9,3,7]].forEach(([r,a,b])=>{for(let i=a;i<=b;i++){f(i,r,"Y");f(i+9,r,"Y");}});[6,7].forEach(r=>{f(5,r,"K");f(6,r,"K");f(13,r,"K");f(14,r,"K");});f(6,6,"W");f(14,6,"W");for(let i=3;i<=7;i++){f(i,4,"E");f(i+9,4,"E");}}
[8,9,10,11].forEach(i=>f(i,9,i===8||i===11?"b":"B"));f(9,10,"B");f(10,10,"B");}
else{for(let j=4;j<=12;j++)for(let i=16;i<=18;i++)if(at(i,j)==="O")f(i,j,"o");
for(let j=3;j<=11;j++)for(let i=0;i<=11;i++)if(at(i,j)==="O"&&Math.hypot(i-5.5,(j-7)*1.1)<5.4)f(i,j,"F");
if(m==="n"||m==="det"){[[5,3,8],[6,2,9],[7,2,9],[8,2,9],[9,3,8]].forEach(([r,a,b])=>{for(let i=a;i<=b;i++)f(i,r,"Y");});[[5,13,15],[6,12,16],[7,12,16],[8,12,16],[9,13,15]].forEach(([r,a,b])=>{for(let i=a;i<=b;i++)f(i,r,"Y");});[[7,6],[8,6],[7,7],[8,7],[15,6],[16,6],[15,7],[16,7]].forEach(([i,j])=>f(i,j,"K"));f(8,6,"W");f(16,6,"W");}
if(m==="n"){for(let i=2;i<=8;i++)f(i,4,"E");for(let i=12;i<=15;i++)f(i,4,"E");}
if(m==="det"){[[2,4],[3,4],[4,4],[5,4],[6,5],[7,5],[8,5],[9,5]].forEach(([i,j])=>f(i,j,"E"));[[12,5],[13,5],[14,4],[15,4],[16,4]].forEach(([i,j])=>f(i,j,"E"));}
if(m==="blink"){for(let i=2;i<=9;i++)f(i,7,"K");for(let i=12;i<=16;i++)f(i,7,"K");for(let i=2;i<=8;i++)f(i,4,"E");for(let i=12;i<=15;i++)f(i,4,"E");}
if(m==="hurt"){[[3,6],[8,6],[12,6],[16,6]].forEach(([i,j])=>f(i,j,"K"));for(let i=4;i<=7;i++)f(i,7,"K");for(let i=13;i<=15;i++)f(i,7,"K");for(let i=2;i<=8;i++)f(i,4,"E");}
if(m==="joy"){[[3,8],[4,7],[5,6],[6,6],[7,7],[8,8],[12,8],[13,7],[14,6],[15,7],[16,8]].forEach(([i,j])=>f(i,j,"K"));for(let i=2;i<=8;i++)f(i,3,"E");for(let i=12;i<=15;i++)f(i,3,"E");}

for(let i=6;i<=15;i++)if(!g[15][i])g[15][i]="o";
const U=(i,j,c)=>set(i,16+j,c);const ar=ARMS[st.arms],lg=LEGS[st.legs];

for(let i=10;i<=13;i++){U(i,1,"I");U(i,4,"I");}[2,3].forEach(j=>{U(11,j,"I");U(12,j,"i");});

return outline(g);}

function makeDiag(fn){const N=22,g=blank(N,N);for(let j=0;j<N;j++)for(let i=0;i<N;i++){const X=i+0.5,Y=j+0.5;const a=((X-2)+(20-Y))/Math.SQRT2,p=((X-2)-(20-Y))/Math.SQRT2;const c=fn(a,p);if(c)g[j][i]=c;}return outline(g);}
function segD(a,p,a1,p1,a2,p2){const da=a2-a1,dp=p2-p1,l=da*da+dp*dp;let u=((a-a1)*da+(p-p1)*dp)/l;u=Math.max(0,Math.min(1,u));return Math.hypot(a-(a1+u*da),p-(p1+u*dp));}
const G_BRUSH=makeDiag((a,p)=>{if(a<0.4)return null;if(a<10){const w=a>2&&a<5?1.4:1.1;if(Math.abs(p)<=w)return p>0?"H":"h";return null;}if(a<11.5){if(Math.abs(p)<=1.6)return p>0?"H":"h";return null;}if(a<14.5){if(Math.abs(p)<=4.3)return a<12.3?"d":p>1.5?"S":p<-2?"d":"s";return null;}if(a<22){if(Math.abs(p)>4.3)return null;if(a>19.6)return p>0?"O":"o";return (Math.floor(p*1.2+20)%2)?"T":"t";}return null;});
const G_ROLLER=makeDiag((a,p)=>{if(a>=12&&a<=18&&p>=-2&&p<=8)return (p<-1.2||a>17.3)?"w":(Math.floor(a*1.4+p*1.4+20)%3===0)?"w":"W";if(a>0.4&&a<6&&Math.abs(p)<=1.2)return p>0?"H":"h";if(a>=6){const d=Math.min(segD(a,p,6,0,8,-3.8),segD(a,p,8,-3.8,15,-3.8),segD(a,p,15,-3.8,15,-2));if(d<=0.7)return "s";}return null;});
const G_TROWEL=makeDiag((a,p)=>{if(a<0.4)return null;if(a<8){if(Math.abs(p)<=1.2)return p>0?"H":"h";return null;}if(a<10.5){if(Math.abs(p)<=0.6)return "d";return null;}if(a<23){const w=a<12?4.3:4.3*(1-(a-12)/11);if(Math.abs(p)>w)return null;if(Math.abs(p)<0.5)return "d";return p>0?"s":"S";}return null;});
const G_BUCKET=toArr(["....kkkkkkkkkkkk......","...k............k.....","..k..............k....",".k................k...","kkkkkkkkkkkkkkkkkkkk..","kOOOOOOOOOOOOOOOOOOk..","kSSSSSSSSSSSSSSSSSdk..",".kSWWWWWWWWWWWWWWdk...",".kSWWWWWWWWWWWWWWdk...",".kSWWOOOOOOOOOOWWdk...",".kSWOOWWOOOOWWOOWdk...",".kSWOOWkOOOOWkOOWdk...",".kSWOOOOOOOOOOOOWdk...",".kSWWOOOOkkOOOOWWdk...",".kSWWWOOOOOOOOWWWdk...",".kSWWWWWWWWWWWWWWdk...","..kSWWWWWWWWWWWWdk....","..kSWWWWWWWWWWWWdk....","..kSssssssssssssdk....","..kSssssssssssdddk....","...kkkkkkkkkkkkkk.....","......................"]);

G.bricks=G.bricks.filter(r=>!r.dead);
tickFx();}
function tickFx(){for(const p of G.parts){p.vy+=0.15;p.x+=p.vx;p.y+=p.vy;p.l--;}G.parts=G.parts.filter(p=>p.l>0&&p.y<FLOOR+2);for(const p of G.pops){p.y-=0.5;p.l--;}G.pops=G.pops.filter(p=>p.l>0);}
/* ---------- render ---------- */
function heroFrame(){const h=G.hero;if(!G.boss.alive)return "win";if(G.lose&&G.hearts<=0)return "hurt";if(h.hurt>0)return "hurt";if(h.atk>0)return h.atk>7?"back":"fwd";if(!h.on)return h.vy<0?"air":"fall";if(h.joy>0)return "joy";if(Math.abs(h.vx)>0.1)return "w"+(Math.floor(G.t/6)%4);if(h.idle>200&&(h.idle%300)<140)return "front";if(G.t%160>154)return "blink";return "idle";}
function drawHero(){const h=G.hero;if(h.inv>0&&(h.inv>>2)%2&&!G.lose)return;const f=heroFrame();const sx=Math.round(h.x-G.camX),sy=Math.round(h.y);
ctx.save();ctx.translate(sx,0);if(h.face<0&&f!=="win"&&f!=="front")ctx.scale(-1,1);
if(h.helmet>0&&(h.helmet>120||(h.helmet>>3)%2)){tintX.clearRect(0,0,24,32);tintX.globalCompositeOperation="source-over";tintX.drawImage(SIL[f],0,0);tintX.globalCompositeOperation="source-in";tintX.fillStyle="hsl("+((G.t*9)%360)+",95%,62%)";tintX.fillRect(0,0,24,32);[[-1,0],[1,0],[0,-1],[0,1],[-2,0],[2,0],[0,-2]].forEach(([dx,dy])=>ctx.drawImage(tintC,-12+dx,sy-29+dy));}
ctx.drawImage(HERO[f],-12,sy-29);if(h.helmet>0)ctx.drawImage(HELMET,-12,sy-32);ctx.restore();}
function sparkle(x,y,t){const k=Math.floor(t/5)%4;const pts=[[-12,-8],[11,-10],[12,8],[-11,10]];const [a,b]=pts[k];ctx.fillStyle="#FFD23F";ctx.fillRect(x+a-1,y+b,3,1);ctx.fillRect(x+a,y+b-1,1,3);ctx.fillStyle="#fff";ctx.fillRect(x+a,y+b,1,1);const [c,d]=pts[(k+2)%4];ctx.fillRect(x+c,y+d,1,1);}
function drawField(){ctx.save();ctx.beginPath();ctx.rect(0,FY,180,204);ctx.clip();
const cam=Math.round(G.camX);ctx.drawImage(BG,cam,0,180,204,0,FY,180,204);
LADDERS.forEach((Ld,i)=>{const lx=Ld.x-6-cam;if(lx<-60||lx>200)return;const tilt=ladTilt(Ld);ctx.drawImage(LAD[String(tilt)],lx,LAD_Y);
if(!G.prize[i]){const px=Ld.x+12+tilt*6-cam;if(Ld.prize==="helmet")ctx.drawImage(TOOLBOX,px,LAD_Y+2);else{ctx.drawImage(HEART_BIG,px+2,LAD_Y+(G.t%40<20?0:-1));}sparkle(px+9,LAD_Y+6,G.t+i*7);}});
WIRES.forEach(w=>{const wx=w.x-cam;if(wx<-20||wx>200)return;ctx.fillStyle="#141214";for(let y=82;y<w.end;y++)ctx.fillRect(wx+Math.round(Math.sin(y/9)*1.5),y,1,1);const ex=wx+Math.round(Math.sin(w.end/9)*1.5);ctx.fillStyle="#d98a3a";ctx.fillRect(ex-1,w.end,4,2);
if((G.wire+w.ph)%140<70){for(let q=0;q<9;q++){const a=Math.random()*6.28,r=3+Math.random()*7;ctx.fillStyle=q%2?"#FFE14A":"#ffffff";ctx.fillRect(Math.round(ex+Math.cos(a)*r),Math.round(w.end+3+Math.sin(a)*r*0.8),1,1);}ctx.fillStyle="rgba(255,225,74,0.18)";ctx.fillRect(ex-8,w.end-6,18,16);}});
for(const it of G.items){if(it.got)continue;const sx=it.x-cam;if(sx<-20||sx>200)continue;const yy=it.y+Math.round(Math.sin((G.t+it.x)/12)*1.5);if(it.k==="heart")ctx.drawImage(HEART_F,sx-4,yy-4);else ctx.drawImage(ITEM[it.k].c,sx-11,yy-11);sparkle(sx,yy,G.t+it.x);}
const b=G.boss;const bsx=BOSS_X-cam;if(bsx<180){const rk=Math.min(1,b.rageT/60);let shx=0;if(b.alive){if(b.hurt>0)shx=b.hurt%2?2:-2;else if(b.rage)shx=Math.round((Math.random()-0.5)*(rk<1?2+rk*6:2));}
const laugh=G.lose&&G.hearts<=0&&b.alive;const fo=b.off+(laugh?((G.t>>2)%2?-3:3):0);
if(b.alive){ctx.drawImage(BOSS_L[0].body,bsx+shx,FY);if(rk>0){ctx.globalAlpha=rk;ctx.drawImage(BOSS_L[1].body,bsx+shx,FY);ctx.globalAlpha=1;}ctx.drawImage(PLAS,bsx+shx,FY);ctx.drawImage(BOSS_L[0].face,bsx+shx,FY+fo);if(rk>0){ctx.globalAlpha=rk;ctx.drawImage(BOSS_L[1].face,bsx+shx,FY+fo);ctx.globalAlpha=1;}}
else{const Ly=BOSS_L[b.rage?1:0];ctx.drawImage(Ly.body,bsx,FY);ctx.drawImage(PLAS,bsx,FY);const a=Math.min(1,Math.max(0,(b.dead-60)/60));if(a<1){ctx.globalAlpha=1-a;ctx.drawImage(Ly.face,bsx,FY+b.off);ctx.globalAlpha=1;}if(a>0){ctx.globalAlpha=a;ctx.drawImage(BOSS[2],bsx,FY);ctx.globalAlpha=1;}}
if(b.alive&&rk>0){for(let k=0;k<22;k++){const fx=bsx+shx+6+Math.floor(rnd(k,3)*104),h2=Math.round((5+Math.floor(rnd(k,5)*8)+((G.t>>2)+k)%3)*rk);for(let j=0;j<h2;j++){const w=Math.max(1,Math.round((h2-j)/2.5));ctx.fillStyle=j<h2*0.35?"#c8643c":j<h2*0.7?"#f2a64a":"#ffd23f";ctx.fillRect(fx-(w>>1),FY+12-j,w,1);}}}
if(b.alive&&b.hurt>0){ctx.fillStyle="rgba(255,255,255,0.25)";ctx.fillRect(bsx+shx+2,FY+6,112,178);}
if(!b.alive&&(b.dead>>3)%2){[[bsx+20,110],[bsx+96,100],[bsx+60,220],[bsx+10,200]].forEach(([a,c])=>{ctx.fillStyle="#FFD23F";ctx.fillRect(a-3,c,7,1);ctx.fillRect(a,c-3,1,7);});}}
const sp=G.sup.box;if(sp){const sx=Math.round(sp.x-cam);if(!sp.land){ctx.fillStyle="#8a7a64";ctx.fillRect(sx,82,1,Math.round(sp.y)-84);}ctx.drawImage(TOOLBOX,sx-9,Math.round(sp.y)-10);if(sp.land&&G.t%20<10)sparkle(sx,Math.round(sp.y)-6,G.t);}
for(const c of G.chunks)ctx.drawImage(CHUNK,Math.round(c.x-cam-7),Math.round(c.y-5));
for(const r of G.bricks)ctx.drawImage(r.hot?BRICK_HOT:BRICK,Math.round(r.x-cam-6),Math.round(r.y-4));
for(const s of G.shots){const c=s.k?ITEM[s.k].c:BLOB;ctx.save();ctx.translate(Math.round(s.x-cam),Math.round(s.y));ctx.rotate(Math.PI/2*(Math.floor(s.r/4)%4)*(s.vx<0?-1:1));ctx.drawImage(c,-Math.floor(c.width/2),-Math.floor(c.height/2));ctx.restore();}
drawHero();
for(const p of G.parts){ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x-cam),Math.round(p.y),2,2);}
for(const p of G.pops){const w=tW(p.s);txt(ctx,p.s,Math.round(p.x-cam-w/2),Math.round(p.y),p.c,1,"#1a1416");}
ctx.restore();}
function drawSpeaker(x,y){ctx.fillStyle=AU.on?"#cfcfd6":"#5c5a66";ctx.fillRect(x,y+3,3,4);for(let k=0;k<4;k++)ctx.fillRect(x+3+k,y+2-k,1,6+2*k);if(AU.on){ctx.fillRect(x+9,y+3,1,4);ctx.fillRect(x+11,y+1,1,8);}else{ctx.fillStyle="#e0323c";for(let k=0;k<6;k++){ctx.fillRect(x+8+k,y+2+k,1,1);ctx.fillRect(x+13-k,y+2+k,1,1);}}}
function drawHUD(){ctx.fillStyle="#000";ctx.fillRect(0,0,180,FY);
txt(ctx,"ОЧКИ",3,3,"#9a9aa2");txt(ctx,String(G.score).padStart(6,"0"),33,3,"#ffffff");txtR(ctx,"ВРЕМЯ "+String(G.time).padStart(3,"0"),177,3,G.time<=60?((G.t>>4)%2?"#ff6b74":"#ffffff"):"#ffffff");
for(let k=0;k<5;k++)ctx.drawImage(k<G.hearts?HEART_F:HEART_E,3+k*11,13);txtR(ctx,"УР.1 СТЕНЫ",177,14,"#f28c28");
SLOTS.forEach(s=>{const k=ITEMS[s.k],n=G.inv[k];ctx.fillStyle="#1e1c22";ctx.fillRect(s.x,s.y,s.w,s.h);ctx.fillStyle=s.k===G.sel?"#f28c28":"#4a4852";ctx.fillRect(s.x,s.y,s.w,1);ctx.fillRect(s.x,s.y+s.h-1,s.w,1);ctx.fillRect(s.x,s.y,1,s.h);ctx.fillRect(s.x+s.w-1,s.y,1,s.h);
ctx.drawImage(n?ITEM[k].c:ITEM[k].dim,s.x+1,s.y+2);txtR(ctx,"X"+n,s.x+s.w-2,s.y+3,n?"#ffffff":"#5c5a66");txtR(ctx,"-"+ITEM[k].dmg,s.x+s.w-2,s.y+17,"#f28c28");});
ctx.fillStyle="#f28c28";ctx.fillRect(0,52,180,1);drawSpeaker(3,62);
if(G.arena){const b=G.boss;txt(ctx,b.alive?"КРИВАЯ СТЕНА":"СТЕНА ПОВЕРЖЕНА",20,55,b.alive?"#ffffff":"#FFD23F");txtR(ctx,b.hp+"/30",177,55,"#ff8a8a");
ctx.fillStyle="#5c5a66";ctx.fillRect(20,65,157,8);ctx.fillStyle="#1a1416";ctx.fillRect(21,66,155,6);
for(let k=0;k<30;k++){const on=k<b.hp;ctx.fillStyle=on?(b.hp<=12?"#FF4A2A":"#e0323c"):"#3a2a2e";ctx.fillRect(22+k*5,66,4,6);if(on){ctx.fillStyle="#ff8a8a";ctx.fillRect(22+k*5,66,4,1);}}}
else{const prog=Math.min(1,G.hero.x/ARENA_X);ctx.fillStyle="#2a2830";ctx.fillRect(20,65,150,4);ctx.fillStyle="#f28c28";ctx.fillRect(20,65,Math.round(150*prog),4);ctx.fillStyle="#e0323c";ctx.fillRect(170,62,6,10);ctx.fillStyle="#1a1416";ctx.fillRect(171,64,1,2);ctx.fillRect(174,64,1,2);}
ctx.fillStyle="#f28c28";ctx.fillRect(0,FY-1,180,1);}
function drawControls(){ctx.fillStyle="#0d0c10";ctx.fillRect(0,280,180,40);
BTN.forEach(b=>{const on=held(b.id);const isT=b.id==="throw";const base=isT?(on?"#c9661a":"#f28c28"):(on?"#2b2a31":"#3b3a43"),dark=isT?"#8a4a14":"#1e1d22",lite=isT?"#ffb25e":"#4e4d57";
ctx.fillStyle=dark;ctx.fillRect(b.x+1,b.y+1,b.w-2,b.h-1);ctx.fillStyle=base;ctx.fillRect(b.x+1,b.y,b.w-2,b.h-3);ctx.fillRect(b.x,b.y+1,b.w,b.h-5);ctx.fillStyle=lite;ctx.fillRect(b.x+2,b.y+1,b.w-4,1);
const cx=b.x+(b.w>>1),cy=b.y+14+(on?1:0);ctx.fillStyle="#eef1f4";
if(b.id==="left"||b.id==="right"){const d=b.id==="left"?-1:1;for(let k=0;k<8;k++)ctx.fillRect(d>0?cx-4+k:cx+3-k,cy-7+k,1,15-2*k);}
if(b.id==="jump"){for(let k=0;k<7;k++)ctx.fillRect(cx-k,cy-8+k,2*k+1,1);ctx.fillRect(cx-2,cy-1,5,8);}
if(isT){let k=ITEMS[G.sel];if(G.inv[k]<=0)k=ITEMS.find(q=>G.inv[q]>0)||null;const c=k?ITEM[k].c:BLOB;ctx.drawImage(c,cx-Math.floor(c.width/2),cy-Math.floor(c.height/2));}});}
function drawScreen(){const s=SCREEN[state];ctx.drawImage(s,0,0);
const rec=()=>NEWBEST?"НОВЫЙ РЕКОРД!":"РЕКОРД "+String(BEST).padStart(6,"0"),recC=()=>NEWBEST?"#FFD23F":"#f28c28";
if(state==="start"){ctx.fillStyle="rgba(20,14,12,0.6)";ctx.fillRect(40,92,100,13);txtC(ctx,"РЕКОРД "+String(BEST).padStart(6,"0"),95,"#f28c28");}
if(state!=="start"&&G){const sc="ОЧКИ "+String(G.score).padStart(6,"0");if(state==="lose"){ctx.fillStyle="rgba(20,14,12,0.6)";ctx.fillRect(30,92,120,26);txtC(ctx,sc,95,"#ffffff");txtC(ctx,rec(),107,recC());}else{txtC(ctx,sc,86,"#FFD23F");ctx.fillStyle="rgba(20,14,12,0.6)";ctx.fillRect(30,96,120,12);txtC(ctx,rec(),98,recC());}}
if((stateT>>4)%2===0){const b=s.btn;ctx.fillStyle="rgba(255,255,255,0.18)";ctx.fillRect(b.x+1,b.y+1,b.w-2,b.h-3);}}
function onScreenTap(){if(stateT<20)return;audioInit();if(state==="start"||state==="lose"){reset();state="play";stateT=0;sfx("start");playSong("level");}else if(state==="win"){state="start";stateT=0;}}
function draw(){ctx.imageSmoothingEnabled=false;if(state==="play"){ctx.fillStyle="#000";ctx.fillRect(0,0,180,320);drawField();drawHUD();drawControls();let f=0;if(G.lose>70)f=(G.lose-70)/40;if(!G.boss.alive&&G.boss.dead>150)f=(G.boss.dead-150)/40;if(stateT<20)f=Math.max(f,1-stateT/20);if(f>0){ctx.fillStyle="rgba(0,0,0,"+Math.min(1,f)+")";ctx.fillRect(0,0,180,320);}}
else{drawScreen();if(stateT<24){ctx.fillStyle="rgba(0,0,0,"+(1-stateT/24)+")";ctx.fillRect(0,0,180,320);}}}
let last=performance.now(),acc=0;const DT=1000/60;
function frame(now){acc+=Math.min(100,now-last);last=now;while(acc>=DT){stateT++;if(state==="play")update();acc-=DT;}draw();requestAnimationFrame(frame);}
reset();requestAnimationFrame(frame);setTimeout(buildMedia,50);
</script>
